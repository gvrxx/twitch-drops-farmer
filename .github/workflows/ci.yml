name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run smoke

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t twitch-drops-farmer .
      - name: Start container and check dashboard and browser view
        run: |
          docker run -d --name farmer --shm-size=1g -e VNC_PASSWORD=ci-test -p 8411:8411 -p 6080:6080 twitch-drops-farmer
          for i in $(seq 1 60); do
            if curl -sf localhost:8411/api/state | grep -q '"phase":"login"'; then ok=1; break; fi
            sleep 2
          done
          docker logs farmer
          [ "${ok:-}" = 1 ] || { echo "Dashboard never reached the login phase"; exit 1; }
          curl -sf localhost:6080/vnc.html > /dev/null || { echo "Browser view not reachable"; exit 1; }
      - name: Check the sign-in window is a normal browser, and reopens until signed in
        run: |
          state() { curl -sf localhost:8411/api/state; }
          wait_for() { for i in $(seq 1 45); do state | grep -q "$1" && return 0; sleep 2; done; echo "Timed out waiting for $1"; docker logs farmer; exit 1; }
          # The sign-in window: Chrome on the app's profile, with no automation attached.
          wait_for '"signingIn":true'
          docker exec farmer sh -c 'for p in /proc/[0-9]*; do tr "\0" " " < $p/cmdline 2>/dev/null; echo; done' | grep "user-data-dir=/data/browser-profile" | grep -v -e "--type=" -e remote-debugging | tee /tmp/signin.txt
          grep -q "twitch.tv/login" /tmp/signin.txt || { echo "No normal sign-in browser running"; exit 1; }
          # Closing it without signing in starts the app's browser and opens the window again.
          curl -sf -X POST -H 'content-type: application/json' -d '{}' localhost:8411/api/signindone
          wait_for 'Opening the sign-in window again'
          wait_for '"signingIn":true'
          docker logs farmer
