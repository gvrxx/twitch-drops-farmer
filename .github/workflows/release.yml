name: Release

# Pushing a tag like v1.2.0 publishes that version: a GitHub release with its
# CHANGELOG notes, and a Docker image at ghcr.io/<owner>/twitch-drops-farmer.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$version" = "$pkg" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $pkg"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Build attestations record the whole GitHub push event, including the
          # pusher's email address, so they're left out of the public image.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md becomes the release notes.
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for ${{ steps.version.outputs.version }}"; exit 1; }
          printf '\n**Docker image:** `%s:%s`\n' "${{ steps.version.outputs.image }}" "${{ steps.version.outputs.version }}" >> notes.md
          # Re-publishing a version (after moving its tag) updates the existing release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Drops Farmer $GITHUB_REF_NAME" --notes-file notes.md
          fi
