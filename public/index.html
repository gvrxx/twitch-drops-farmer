<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drops Farmer</title>
<style>
  :root {
    --bg: #f6f5f8; --panel: #ffffff; --text: #18161d; --muted: #6b6775; --line: #e4e1ea;
    --accent: #7c4dff; --accent-soft: #efe9ff; --ok: #1f9d55; --warn: #c27c0e; --bad: #d64545;
    --bar: #ece9f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111015; --panel: #1b1a21; --text: #ecebf0; --muted: #9a96a6; --line: #2c2a34;
      --accent: #a68bff; --accent-soft: #2a2340; --ok: #4ccb84; --warn: #e3a84a; --bad: #ef6b6b; --bar: #2a2833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover, a.button:hover { border-color: var(--accent); }
  a.button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; text-decoration: none; }
  a.button[hidden] { display: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12px; }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .alert { color: var(--bad); border-left: 3px solid var(--bad); padding-left: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .muted { color: var(--muted); }
  .now { display: grid; gap: 12px; }
  .now-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .now-head a { font-size: 18px; font-weight: 600; color: var(--text); }
  .game { display: grid; grid-template-columns: auto 48px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
  .game + .game { border-top: 1px solid var(--line); }
  .game img { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; background: var(--bar); }
  .game .name { font-weight: 600; }
  .game .order { display: flex; gap: 4px; }
  .game .order button { padding: 2px 8px; }
  .game input { width: 18px; height: 18px; accent-color: var(--accent); }
  .campaigns { grid-column: 2 / -1; display: grid; gap: 10px; }
  .campaign { border-left: 3px solid var(--line); padding-left: 10px; }
  .campaign.linked-no { border-left-color: var(--bad); }
  .drop { display: grid; grid-template-columns: 28px 1fr 90px; gap: 8px; align-items: center; margin-top: 6px; font-size: 13px; }
  .drop img { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; background: var(--bar); }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .drop.done .bar > span { background: var(--ok); }
  .drop .min { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log { font: 12px/1.6 ui-monospace, Menlo, monospace; max-height: 260px; overflow: auto; }
  .log .warn { color: var(--warn); } .log .error { color: var(--bad); } .log .success { color: var(--ok); }
  .empty { padding: 24px 16px; text-align: center; }
  .add-game { position: relative; display: flex; gap: 8px; margin-bottom: 10px; }
  .add-game input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .suggest { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); overflow: hidden; }
  .suggest[hidden] { display: none; }
  .suggest button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 0; padding: 6px 10px; text-align: left; background: none; }
  .suggest button + button { border-top: 1px solid var(--line); }
  .suggest button.active, .suggest button:hover { background: var(--accent-soft); }
  .suggest button:disabled { cursor: default; opacity: .6; }
  .suggest img { width: 27px; height: 36px; object-fit: cover; border-radius: 3px; background: var(--bar); flex: none; }
  .suggest .tag { margin-left: auto; font-size: 12px; color: var(--muted); }
  .suggest .note { padding: 8px 10px; font-size: 13px; }
  .fold { padding: 2px 8px; font-size: 12px; color: var(--muted); }
  .summary { font-size: 13px; }
  .dormant { color: var(--warn); }
  .dormant.unlinked, .unlinked-note { color: var(--bad); }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .order-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; }
  .row + .row, .row + .more, .more + .row { border-top: 1px solid var(--line); }
  .row img { width: 36px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--bar); }
  .row img.square { height: 36px; object-fit: contain; }
  .row .name { font-weight: 600; }
  .tag { font-size: 12px; color: var(--muted); }
  .more { padding: 8px 16px; }
  .more button { font-size: 13px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  a { color: var(--accent); }
  @media (max-width: 560px) {
    .game { grid-template-columns: auto 40px 1fr; }
    .game .order { grid-column: 2 / -1; }
    .game img { width: 40px; height: 54px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Drops Farmer</h1>
    <span id="status" class="pill"><span class="dot"></span><span>Connecting…</span></span>
    <label class="toggle"><input type="checkbox" id="autoclaim"> Auto-claim</label>
    <a id="view" class="button" target="_blank" rel="noopener" hidden>Browser view</a>
    <button id="refresh">Refresh now</button>
    <button id="pause" class="primary">Pause</button>
  </header>

  <section class="card now" id="now"></section>

  <h2>Games <span class="muted" id="gameshint" style="text-transform:none;letter-spacing:0"></span></h2>
  <div class="order-row">
    <label for="order">Farm first:</label>
    <select id="order">
      <option value="ending">The campaign ending soonest</option>
      <option value="priority">My order (↑↓)</option>
    </select>
  </div>
  <form id="addgame" class="add-game">
    <input id="addname" type="text" placeholder="Search any game to add it, e.g. Rust" aria-label="Search for a game" autocomplete="off"
      role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
    <button type="submit">Add game</button>
    <div id="suggest" class="suggest" role="listbox" hidden></div>
  </form>
  <section class="card" style="padding:0" id="games"></section>

  <h2>Needs linking <span class="muted" style="text-transform:none;letter-spacing:0">· campaigns that are skipped until you link your game account</span></h2>
  <section class="card" style="padding:0" id="linking"></section>

  <h2>History</h2>
  <section class="card" style="padding:0" id="history"></section>

  <h2>Activity</h2>
  <section class="card log" id="log"></section>
</main>
<script>
  let state = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//.test(u ?? '') ? esc(u) : '');
  const ago = (t) => { if (!t) return 'never'; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : `${m} min ago`; };
  const left = (iso) => { const ms = Date.parse(iso) - Date.now(); if (!(ms > 0)) return ''; const h = ms / 3.6e6; return h > 48 ? `${Math.round(h / 24)} days left` : `${Math.round(h)} h left`; };

  async function post(path, body = {}) {
    const res = await fetch('/api/' + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) alert(data.error ?? 'Request failed');
    return data;
  }

  // Which drop lists are folded away ('now' or a game id), remembered in this browser.
  const collapsed = new Set((() => { try { return JSON.parse(localStorage.getItem('collapsed') ?? '[]'); } catch { return []; } })());
  function toggleCollapsed(key) {
    collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key);
    try { localStorage.setItem('collapsed', JSON.stringify([...collapsed])); } catch {}
    render();
  }
  const foldButton = (key, count) =>
    `<button class="fold" data-act="collapse" data-key="${esc(key)}" aria-expanded="${!collapsed.has(key)}">${collapsed.has(key) ? `Show drops (${count})` : 'Hide drops'}</button>`;

  // One line standing in for a folded drop list.
  function dropSummary(camps) {
    const drops = camps.flatMap((c) => c.drops);
    const claimed = drops.filter((d) => d.claimed).length;
    const next = drops.filter((d) => !d.claimed && d.required).sort((a, b) => (b.current / b.required) - (a.current / a.required))[0];
    return `<div class="summary muted">${claimed} of ${drops.length} drops claimed${next ? ` · closest: ${esc(next.name)} ${next.current}/${next.required} min` : ''}</div>`;
  }

  function selectedGames() {
    return state.games.filter((g) => g.priority != null).sort((a, b) => a.priority - b.priority).map((g) => ({ id: g.id, name: g.name, boxArtURL: g.boxArtURL }));
  }

  function renderStatus() {
    const s = $('status');
    const labels = { starting: 'Starting', login: 'Login needed', refreshing: 'Refreshing', searching: 'Searching', watching: 'Farming', idle: 'Idle', dormant: 'Dormant', blocked: 'Blocked by Twitch', paused: 'Paused' };
    s.className = 'pill' + (state.phase === 'watching' ? ' ok' : state.phase === 'blocked' ? ' bad' : ['login', 'idle', 'dormant', 'paused'].includes(state.phase) ? ' warn' : '');
    s.lastElementChild.textContent = labels[state.phase] ?? state.phase;
    $('pause').textContent = state.paused ? 'Resume' : 'Pause';
    $('autoclaim').checked = state.autoClaim;
    const view = $('view');
    view.hidden = !state.browserViewPort;
    if (state.browserViewPort) view.href = `${location.protocol}//${location.hostname}:${state.browserViewPort}/vnc.html?autoconnect=1&resize=scale`;
  }

  function dropRow(d) {
    const pct = d.required ? Math.min(100, (d.current / d.required) * 100) : 0;
    const done = d.claimed || (d.required && d.current >= d.required);
    const status = d.claimed ? 'claimed' : done ? 'ready' : `${d.current}/${d.required} min`;
    return `<div class="drop${done ? ' done' : ''}">
      ${d.image ? `<img src="${safeUrl(d.image)}" alt="">` : '<img alt="">'}
      <div>${esc(d.name)}<div class="bar"><span style="width:${pct}%"></span></div></div>
      <div class="min">${status}</div></div>`;
  }

  function campaignBlock(c) {
    const notLinked = c.accountConnected === false;
    return `<div class="campaign${notLinked ? ' linked-no' : ''}">
      <div><strong>${esc(c.name)}</strong> <span class="muted">· ${left(c.endAt)}${c.allowedChannels ? ` · ${c.allowedChannels} specific channels` : ''}</span></div>
      ${notLinked ? `<div class="unlinked-note">Game account not linked; this campaign is skipped.${c.accountLinkURL ? ` <a href="${safeUrl(c.accountLinkURL)}" target="_blank" rel="noopener">Link account</a>` : ''}</div>` : ''}
      ${c.drops.length ? c.drops.map(dropRow).join('') : c.detailsLoaded ? '' : '<div class="muted">Drop list loads once this game is selected.</div>'}
    </div>`;
  }

  function renderNow() {
    const w = state.watching;
    const refused = state.campaignsRefused
      ? '<div class="alert">Twitch refused to send your drop campaigns at the last check ("failed integrity check"). It is blocking this automated browser from the campaign list, so new campaigns and progress can\'t be seen. See Troubleshooting in the README.</div>'
      : '';
    // The blocked status message repeats the alert, so show just the alert then.
    const msg = refused + (state.message && !(refused && state.phase === 'blocked') ? `<div class="muted">${esc(state.message)}</div>` : '');
    if (!w) {
      $('now').innerHTML = `<div class="now-head"><strong>Not watching anything</strong></div>${msg}
        <div class="muted">Campaigns checked ${ago(state.lastCampaignRefresh)} · inventory checked ${ago(state.lastInventoryRefresh)}${state.user ? ` · logged in as ${esc(state.user.displayName ?? state.user.login)}` : ''}</div>`;
      return;
    }
    const game = state.games.find((g) => g.id === w.gameId);
    const camps = (game?.campaigns ?? []).filter((c) => w.campaignIds?.includes(c.id));
    $('now').innerHTML = `<div class="now-head">
        <a href="https://www.twitch.tv/${encodeURIComponent(w.login)}" target="_blank" rel="noopener">${esc(w.displayName)}</a>
        <span class="muted">${esc(w.gameName ?? '')} · since ${new Date(w.since).toLocaleTimeString()}</span>
        <span class="pill ${w.videoOk ? 'ok' : 'warn'}"><span class="dot"></span>${w.videoOk ? 'Video playing' : 'Video stalled'}</span>
        ${camps.some((c) => c.drops.length) ? foldButton('now', camps.reduce((n, c) => n + c.drops.length, 0)) : ''}
      </div>${msg}
      ${collapsed.has('now') ? dropSummary(camps) : camps.map(campaignBlock).join('')}
      <div class="muted">Inventory checked ${ago(state.lastInventoryRefresh)}${state.user ? ` · logged in as ${esc(state.user.displayName ?? state.user.login)}` : ''}</div>`;
  }

  // Roughly what the app can still earn in a campaign, to mirror its farming order.
  const farmable = (c) => c.accountConnected !== false && (!c.drops.length || c.drops.some((d) => !d.claimed && (!d.required || d.current < d.required)));
  const soonestEnd = (g) => Math.min(Infinity, ...g.campaigns.filter(farmable).map((c) => Date.parse(c.endAt) || Infinity));

  // Selected games in the order the app tries them.
  function farmingOrder() {
    const sel = selectedGames();
    if (state.farmOrder !== 'ending') return sel;
    const ends = new Map(state.games.map((g) => [g.id, soonestEnd(g)]));
    return [...sel].sort((a, b) => ends.get(a.id) - ends.get(b.id) || 0);
  }

  function renderGames() {
    $('order').value = state.farmOrder;
    $('gameshint').textContent = state.farmOrder === 'ending'
      ? '· tick to farm; numbers show the farming order, ↑↓ breaks ties'
      : '· tick to farm, top = highest priority';
    if (!state.games.length) {
      $('games').innerHTML = `<div class="empty muted">${state.phase === 'login' ? 'Log in to Twitch to load campaigns.' : state.campaignsRefused ? 'Twitch refused to send the campaign list.' : 'No active drop campaigns found yet.'}</div>`;
      return;
    }
    const sel = selectedGames();
    const order = farmingOrder();
    $('games').innerHTML = state.games.map((g) => {
      const idx = sel.findIndex((s) => s.id === g.id);
      const on = idx >= 0;
      const rank = order.findIndex((s) => s.id === g.id);
      return `<div class="game" data-id="${esc(g.id)}">
        <input type="checkbox" ${on ? 'checked' : ''} data-act="toggle" aria-label="Farm ${esc(g.name)}">
        ${g.boxArtURL ? `<img src="${safeUrl(g.boxArtURL)}" alt="">` : '<img alt="">'}
        <div><div class="name">${on ? `${rank + 1}. ` : ''}${esc(g.name)}</div>
          <div class="muted">${g.campaigns.length} active campaign${g.campaigns.length === 1 ? '' : 's'}</div>
          ${g.dormant ? `<div class="dormant${g.dormant.reason === 'Game account not linked' ? ' unlinked' : ''}">Dormant: ${esc(g.dormant.reason)} · next check ${new Date(g.dormant.nextCheckAt).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>` : ''}
          ${on && g.campaigns.some((c) => c.drops.length) ? foldButton(g.id, g.campaigns.reduce((n, c) => n + c.drops.length, 0)) : ''}</div>
        <div class="order">${on ? `<button data-act="up" ${idx === 0 ? 'disabled' : ''} aria-label="Higher priority">↑</button><button data-act="down" ${idx === sel.length - 1 ? 'disabled' : ''} aria-label="Lower priority">↓</button>` : ''}</div>
        ${on && g.campaigns.length ? `<div class="campaigns">${collapsed.has(g.id) ? dropSummary(g.campaigns) : g.campaigns.map(campaignBlock).join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  // Games with campaigns waiting for a game account link; selected games first.
  function renderLinking() {
    const sel = new Set(selectedGames().map((g) => g.id));
    const rows = state.games
      .map((g) => ({ g, camps: g.campaigns.filter((c) => c.accountConnected === false) }))
      .filter((r) => r.camps.length)
      .sort((a, b) => sel.has(b.g.id) - sel.has(a.g.id) || a.g.name.localeCompare(b.g.name));
    if (!rows.length) {
      const loaded = state.games.some((g) => g.campaigns.length);
      $('linking').innerHTML = `<div class="empty muted">${loaded ? 'Every active campaign is linked.' : 'Campaigns show here once they load.'}</div>`;
      return;
    }
    const mine = rows.filter((r) => sel.has(r.g.id));
    const others = rows.filter((r) => !sel.has(r.g.id));
    const showOthers = collapsed.has('linking-others');
    const row = ({ g, camps }) => {
      const url = camps.find((c) => c.accountLinkURL)?.accountLinkURL;
      const ends = Math.min(...camps.map((c) => Date.parse(c.endAt) || Infinity));
      return `<div class="row">
        ${g.boxArtURL ? `<img src="${safeUrl(g.boxArtURL)}" alt="">` : '<img alt="">'}
        <div><div class="name${sel.has(g.id) ? ' unlinked-note' : ''}">${esc(g.name)}${sel.has(g.id) ? ' <span class="tag">· selected</span>' : ''}</div>
          <div class="muted">${camps.map((c) => esc(c.name)).join(', ')}${Number.isFinite(ends) ? ` · ${left(new Date(ends).toISOString())}` : ''}</div></div>
        ${url ? `<a class="button" href="${safeUrl(url)}" target="_blank" rel="noopener">Link account</a>` : '<span class="muted">No link given</span>'}
      </div>`;
    };
    $('linking').innerHTML = (mine.length ? mine.map(row).join('') : '<div class="more muted">All your selected games are linked.</div>')
      + (others.length ? `<div class="more"><button data-act="collapse" data-key="linking-others" aria-expanded="${showOthers}">${showOthers ? 'Hide other games' : `Show ${others.length} other game${others.length === 1 ? '' : 's'}`}</button></div>` : '')
      + (showOthers ? others.map(row).join('') : '')
      + '<div class="more muted">After linking, click <strong>Refresh now</strong> so the app picks it up.</div>';
  }

  const hours = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`);

  // Drops claimed and time watched, saved across restarts.
  function renderHistory() {
    const h = state.history;
    if (!h) return;
    const total = h.watch.reduce((n, w) => n + w.minutes, 0);
    const chips = h.watch.length
      ? `<div class="chips"><span class="chip"><strong>${hours(total)}</strong> watched</span>${h.watch.map((w) => `<span class="chip">${esc(w.name)}: ${hours(w.minutes)}</span>`).join('')}</div>`
      : '';
    const showAll = collapsed.has('history-all');
    const list = showAll ? h.claims : h.claims.slice(0, 8);
    const since = new Date(h.since).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
    $('history').innerHTML = chips + (h.claims.length
      ? list.map((c) => `<div class="row">
          ${c.image ? `<img class="square" src="${safeUrl(c.image)}" alt="">` : '<img class="square" alt="">'}
          <div><div class="name">${esc(c.drop)}</div><div class="muted">${esc(c.game)}${c.campaign ? ` · ${esc(c.campaign)}` : ''}</div></div>
          <span class="muted">${new Date(c.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
        </div>`).join('')
        + (h.claims.length > 8 ? `<div class="more"><button data-act="collapse" data-key="history-all" aria-expanded="${showAll}">${showAll ? 'Show fewer' : `Show all (${Math.min(h.claims.length, 50)})`}</button></div>` : '')
      : `<div class="empty muted">No drops claimed since ${since}. Claims show here as they happen.</div>`);
  }

  function renderLog() {
    const el = $('log');
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    const today = new Date().toDateString();
    const when = (t) => new Date(t).toDateString() === today ? new Date(t).toLocaleTimeString() : new Date(t).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    el.innerHTML = state.log.map((l) => `<div class="${l.level}"><span class="muted">${when(l.t)}</span> ${esc(l.msg)}</div>`).join('') || '<div class="muted">Nothing yet.</div>';
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  function render() { renderStatus(); renderNow(); renderGames(); renderLinking(); renderHistory(); renderLog(); }

  for (const id of ['now', 'linking', 'history']) {
    $(id).addEventListener('click', (e) => {
      if (e.target.dataset.act === 'collapse') toggleCollapsed(e.target.dataset.key);
    });
  }
  $('order').onchange = (e) => post('order', { order: e.target.value });
  $('games').addEventListener('click', (e) => {
    const act = e.target.dataset.act;
    if (act === 'collapse') return toggleCollapsed(e.target.dataset.key);
    const id = e.target.closest('.game')?.dataset.id;
    if (!act || !id) return;
    let sel = selectedGames();
    const i = sel.findIndex((g) => g.id === id);
    if (act === 'toggle') {
      sel = i >= 0 ? sel.filter((g) => g.id !== id) : [...sel, { id, name: state.games.find((g) => g.id === id).name }];
    } else {
      const j = act === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= sel.length) return;
      [sel[i], sel[j]] = [sel[j], sel[i]];
    }
    post('games', { games: sel });
  });
  // ---- game search: games with drops show at once, Twitch's own search follows
  let results = [];
  let active = -1;
  let searchSeq = 0;
  let searchTimer = null;

  function showSuggestions(note) {
    const box = $('suggest');
    const selected = new Set(selectedGames().map((g) => g.id));
    box.innerHTML = results.map((g, i) => {
      const tag = selected.has(g.id) ? 'Selected' : g.hasDrops ? 'Has drops' : 'No event right now';
      return `<button type="button" role="option" data-i="${i}" class="${i === active ? 'active' : ''}" ${selected.has(g.id) ? 'disabled' : ''}>
        ${g.boxArtURL ? `<img src="${safeUrl(g.boxArtURL)}" alt="">` : '<img alt="">'}<span>${esc(g.name)}</span><span class="tag">${tag}</span></button>`;
    }).join('') + (note ? `<div class="note muted">${esc(note)}</div>` : '');
    box.hidden = !results.length && !note;
    $('addname').setAttribute('aria-expanded', String(!box.hidden));
  }

  function hideSuggestions() {
    clearTimeout(searchTimer);
    searchSeq++;
    results = [];
    active = -1;
    showSuggestions('');
  }

  function addResult(game) {
    if (!game || selectedGames().some((g) => g.id === game.id)) return;
    post('games', { games: [...selectedGames(), { id: game.id, name: game.name, boxArtURL: game.boxArtURL }] });
    $('addname').value = '';
    hideSuggestions();
  }

  function mergeResults(more) {
    const ids = new Set(results.map((g) => g.id));
    const withDrops = new Set(state.games.filter((g) => g.campaigns.length).map((g) => g.id));
    for (const g of more) if (!ids.has(g.id)) results.push({ ...g, hasDrops: withDrops.has(g.id) });
  }

  $('addname').addEventListener('input', () => {
    const term = $('addname').value.trim();
    const seq = ++searchSeq;
    clearTimeout(searchTimer);
    active = -1;
    if (term.length < 2) return hideSuggestions();
    results = [];
    const lower = term.toLowerCase();
    mergeResults(state.games.filter((g) => g.name.toLowerCase().includes(lower)).slice(0, 5));
    showSuggestions('Searching Twitch…');
    searchTimer = setTimeout(async () => {
      const data = await post('searchgames', { term });
      if (seq !== searchSeq) return; // a newer search has started
      mergeResults(data.games ?? []);
      showSuggestions(results.length ? '' : `No games found for "${term}".`);
    }, 400);
  });
  $('addname').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!results.length) return;
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
      showSuggestions($('suggest').querySelector('.note')?.textContent ?? '');
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });
  $('suggest').addEventListener('mousedown', (e) => e.preventDefault()); // keep focus in the input
  $('suggest').addEventListener('click', (e) => {
    const i = e.target.closest('button')?.dataset.i;
    if (i != null) addResult(results[i]);
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#addgame')) hideSuggestions();
  });
  $('addgame').addEventListener('submit', (e) => {
    e.preventDefault();
    if (active >= 0) return addResult(results[active]);
    const name = $('addname').value.trim();
    if (!name) return;
    // Exact name match from the suggestions, else let the app look it up.
    const exact = results.find((g) => g.name.toLowerCase() === name.toLowerCase());
    if (exact) return addResult(exact);
    post('addgame', { name });
    $('addname').value = '';
    hideSuggestions();
  });
  $('refresh').onclick = () => post('refresh');
  $('pause').onclick = () => post(state?.paused ? 'resume' : 'pause');
  $('autoclaim').onchange = (e) => post('autoclaim', { enabled: e.target.checked });

  const events = new EventSource('/api/events');
  events.onmessage = (e) => { state = JSON.parse(e.data); render(); };
  events.onerror = () => { $('status').className = 'pill warn'; $('status').lastElementChild.textContent = 'Disconnected'; };
  setInterval(() => state && renderNow(), 30000);
</script>
</body>
</html>
